# Backend code style configuration.
#
# Keep black, isort, and ruff aligned with the project's 100-column style.
# Explicit settings avoid formatter defaults rewriting the source into
# inconsistent layouts when running `make lint`.

[tool.black]
line-length = 100

[tool.isort]
# Match black's multiline imports so repeated formatter runs remain stable.
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep the rule set stable after Ruff 0.16 expanded its implicit defaults.
# `make lint` checks correctness and syntax here, and checks import order
# through its separate isort step.
select = ["E4", "E7", "E9", "F"]

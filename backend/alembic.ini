# Alembic configuration - PFIM schema versioning.

[alembic]
script_location = migrations
prepend_sys_path = .

# Use the OS separator for `prepend_sys_path` and `version_locations`.
# The legacy space/comma/colon split is deprecated and incorrectly splits
# Windows drive letters. Replaces `version_path_separator`, deprecated
# since Alembic 1.16.
path_separator = os

# migrations/env.py reads the actual URL from app.config.settings at runtime.
sqlalchemy.url = sqlite:///../data/pfim.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
